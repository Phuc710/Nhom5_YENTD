# Mosquitto local broker config for Traffic AI (dev/integration)
# Listeners:
# - 1883: native MQTT clients (backend/simulator/device)
# - 9001: MQTT over WebSocket (optional browser clients)

allow_anonymous true

listener 1883
protocol mqtt

listener 9001
protocol websockets

persistence true
persistence_location ./

max_connections 200

connection_messages true
log_timestamp true
