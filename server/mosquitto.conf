# Mosquitto MQTT Broker — Local config cho AI Traffic Control
# File này đặt cùng thư mục với app.py

# Lắng nghe port 1883 (MQTT default)
listener 1883

# Cho phép kết nối không cần password (local development)
allow_anonymous true

# Log file
#log_dest file mosquitto.log

# Persistence
persistence true
persistence_location ./

# Max connections
max_connections 50