# Cấu hình Mosquitto cho phép Backend kết nối từ ngoài Docker
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket cho Frontend (nếu cần)
listener 9001 0.0.0.0
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
